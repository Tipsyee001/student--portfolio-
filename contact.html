<main>
<div class="wrap page-title"><p class="eyebrow">Contact</p><h1>Get in <em>touch</em></h1><div class="rule"></div><p>Have a question or a project idea? Send me a message below.</p></div>
<section>
<div class="wrap contact">
<form class="card" id="contactForm" novalidate>
<div class="field"><label for="fullName">Name</label><input type="text" id="fullName" autocomplete="name" placeholder="Your name"><p class="error" id="fullNameError"></p></div>
<div class="field"><label for="email">Email address</label><input type="text" id="email" autocomplete="email" placeholder="you@example.com"><p class="error" id="emailError"></p></div>
<div class="field"><label for="phone">Phone number</label><input type="text" id="phone" inputmode="numeric" autocomplete="tel" placeholder="Digits only, e.g. 2348012345678"><p class="error" id="phoneError"></p></div>
<div class="field"><label for="message">Message</label><textarea id="message" rows="5" placeholder="Write your message here..."></textarea><p class="error" id="messageError"></p></div>
<button class="btn" type="submit">Send message</button>
<p id="formStatus" role="status"></p>
</form>
<aside class="card"><h3>Contact details</h3>
<ul class="clean" style="margin-top:.8rem"><li>Obanla Temitope Samuel</li><li><a href="tel:+2348033834466">+234 803 383 4466</a></li></ul></aside>
</div>
</section>
